name: parela
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.9 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  shared_preferences: ^2.3.3
  http: ^1.2.2
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  flutter_local_notifications: ^18.0.0
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#FCEDF3"
  image: assets/icon/app_icon.png
  android_12:
    color: "#FCEDF3"
    image: assets/icon/app_icon.png
  web: false

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/public/products/esqa-lipstik/
    - assets/public/products/esqa-eyeshadow/
    - assets/public/products/esqa-bedak/
    - assets/public/products/foc-parfume-meteore/
    - assets/public/videos/esqa-lipstik-story/
    - assets/public/videos/esqa-eyeshadow-story/
    - assets/public/videos/foc-parfume-story/
    - assets/public/videos/iok-celana-story/
    - assets/public/videos/iok-jaket-story/
    - assets/public/videos/iok-shino-pendek-story/
    - assets/public/videos/feed-1/
    - assets/public/videos/feed-2/
    - assets/public/videos/feed-3/
    - assets/public/products/iok-celana-olahraga/
    - assets/public/products/iok-shino-pendek/
    - assets/public/products/iok-shino-pants/
    - assets/public/products/iok-jaket-antiuv/
    - assets/public/products/random/
    - assets/public/sellers/esqa-mall/
    - assets/public/sellers/iok-mall/
    - assets/public/sellers/foc-offisial/
    - assets/public/banners/
    - assets/public/flashsale/
    - assets/public/category/
